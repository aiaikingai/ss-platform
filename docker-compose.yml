# =====================================================================
# ss-platform — Phase 1 runtime
#
# NO SECRETS IN THIS FILE. It is tracked by git.
# The password lives in .env, which is gitignored.
#
# Docker Compose automatically reads .env from this same folder.
# The ${VAR:?message} syntax means: fail loudly with that message if the
# variable is missing — better than silently starting with a blank
# password and leaving you to debug it later.
#
# Start:  docker compose up -d
# Stop:   docker compose down          (data survives — it's in a volume)
# Wipe:   docker compose down -v       (DESTROYS all data)
# =====================================================================

services:

  db:
    # timescaledb-ha ships PostgreSQL 16 with the TimescaleDB extension
    # already compiled in. You don't have to enable it — §7 of the schema
    # stays commented out until needed. Using this image now means
    # enabling it later is one SQL statement, not a migration.
    image: timescale/timescaledb-ha:pg16
    container_name: ssplat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sslab
      POSTGRES_USER: sslab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Exposed on the LAN so your Mac and the Windows PCs can reach it.
      # In production, bind to a specific interface instead of 0.0.0.0.
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      # Scripts here run ONCE, on first startup only. After the volume
      # exists they are ignored — use Alembic for later changes.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sslab -d sslab"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: ssplat-metabase
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Metabase stores its OWN config (dashboards, users) in Postgres,
      # in a separate database. Never let it use the default H2 file
      # store — H2 corrupts and you lose every dashboard you built.
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: sslab
      MB_DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      MB_DB_HOST: db
      JAVA_TIMEZONE: Asia/Shanghai
    volumes:
      - metabase_data:/metabase-data

volumes:
  pgdata:
  metabase_data:
